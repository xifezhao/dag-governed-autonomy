[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dag-governed-autonomy"
version = "1.0.0"
description = "Dynamic Architectural Guardrail (DAG): Halting Architectural Entropy in Agentic Software Workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Anonymous Authors (SANER 2026 Submission)"}
]
keywords = [
    "agentic software engineering",
    "architectural technical debt",
    "dynamic guardrails",
    "multi-agent systems",
    "static analysis",
    "software architecture"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "networkx>=3.2",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "tiktoken>=0.7.0",
]
ast = [
    "radon>=6.0.1",
    "javalang>=0.13.0",
    "tree-sitter>=0.21.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
